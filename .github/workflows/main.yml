name: Upload

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get update
      - run: sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt
      - run: pip install -r requests

      - run: python main.py
